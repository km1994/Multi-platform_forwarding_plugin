<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>演示编辑器 · 用于验证插件填充链路</title>
<style>
  body {
    margin: 0; padding: 40px;
    background: #f4f4f8;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; justify-content: center;
  }
  .editor {
    width: 720px; background: #fff; border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 28px 32px;
  }
  h1 { font-size: 18px; color: #333; margin-bottom: 4px; }
  .hint { font-size: 12px; color: #999; margin-bottom: 20px; }
  #demo-title {
    width: 100%; font-size: 20px; font-weight: 700;
    border: none; border-bottom: 1px solid #eee;
    padding: 10px 4px; outline: none; margin-bottom: 16px;
    box-sizing: border-box;
  }
  #demo-content {
    width: 100%; min-height: 320px; box-sizing: border-box;
    border: 1px solid #e5e5ee; border-radius: 8px;
    padding: 14px; font: 13px/1.7 Consolas, Menlo, monospace;
    outline: none; resize: vertical;
  }
  #demo-content:focus, #demo-title:focus { border-color: #6366f1; }
  .preview { margin-top: 20px; border-top: 1px dashed #ddd; padding-top: 16px; }
  .preview h2 { font-size: 14px; color: #666; }
</style>
</head>
<body>
  <div class="editor">
    <h1>演示编辑器</h1>
    <p class="hint">
      模拟平台文章编辑器：标题输入框 + Markdown 文本域。<br>
      用「多平台转发助手」勾选「本地演示页」并同步，本文档的标题和正文会被自动填充。
    </p>
    <input id="demo-title" type="text" placeholder="请输入标题" />
    <textarea id="demo-content" placeholder="请输入 Markdown 正文"></textarea>
    <div class="preview">
      <h2>实时预览</h2>
      <div id="preview-title" style="font-weight:700;margin:8px 0;"></div>
      <div id="preview-body" style="font-size:13px;color:#444;white-space:pre-wrap;"></div>
    </div>
  </div>
  <script>
    const title = document.getElementById('demo-title');
    const content = document.getElementById('demo-content');
    function refresh() {
      document.getElementById('preview-title').textContent = title.value;
      document.getElementById('preview-body').textContent = content.value;
    }
    title.addEventListener('input', refresh);
    content.addEventListener('input', refresh);
  </script>
</body>
</html>
